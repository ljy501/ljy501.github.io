baseURL = 'https://ljy501.github.io/'
locale = 'zh-CN'
title = "Liu Junyu's Blog"
theme = 'stack'
enableRobotsTXT = true
paginate = 6

# 允许首页门户区使用 HTML 标签（技能标签/项目卡片）
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]
  [[menu.main]]
    identifier = 'home'
    name = '首页 Home'
    url = '/'
    weight = 1
  [[menu.main]]
    identifier = 'about'
    name = '关于 About'
    url = '/about/'
    weight = 2
  [[menu.main]]
    identifier = 'post'
    name = '博客 Blog'
    url = '/post/'
    weight = 3
  [[menu.main]]
    identifier = 'contact'
    name = '联系 Contact'
    url = '/contact/'
    weight = 4
